services:
  intel:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_PATH: /app/data/intel.db
      VT_API_KEY: ${VT_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    volumes:
      - intel-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  intel-data:
